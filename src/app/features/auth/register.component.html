<section class="auth-shell">
  <div class="auth-card">
    <div class="section-title">
      <h2>Register</h2>
    </div>
    <div class="field-grid">
      <div class="field">
        <label>First name</label>
        <input [(ngModel)]="form.firstName" placeholder="John" />
      </div>
      <div class="field">
        <label>Last name</label>
        <input [(ngModel)]="form.lastName" placeholder="Doe" />
      </div>
      <div class="field">
        <label>Login</label>
        <input [(ngModel)]="form.login" placeholder="john" />
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" [(ngModel)]="form.password" placeholder="••••••••" />
      </div>
    </div>
    <button class="primary" (click)="submit()">Create account</button>
    <p class="error" *ngIf="error">{{ error }}</p>
    <p *ngIf="message">{{ message }}</p>
  </div>
</section>

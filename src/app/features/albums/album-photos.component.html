<section>
  <a class="back-link" routerLink="/albums">
    <span class="icon">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M15 6 9 12l6 6" fill="none" stroke="currentColor" stroke-width="1.6" />
      </svg>
    </span>
    Back to Albums
  </a>

  <div class="section-title">
    <h2>{{ album?.name || 'Album' }}</h2>
    <p class="muted">{{ photos.length }} images</p>
  </div>

  <p class="error" *ngIf="error">{{ error }}</p>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Thumbnail</th>
          <th>Likes</th>
          <th>Dislikes</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let photo of photos">
          <td>
            <img
              class="thumb clickable"
              [src]="photo.url"
              alt="thumbnail"
              (click)="openPreview(photo.url)"
            />
          </td>
          <td>
            <span class="count like">{{ photo.likes }}</span>
          </td>
          <td>
            <span class="count dislike">{{ photo.dislikes }}</span>
          </td>
          <td class="actions">
            <button class="btn ghost" (click)="react(photo.id, true)" [disabled]="!canReact">
              <span class="icon">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path
                    d="M7 11V20H4v-9h3Zm3-5 1-3a2 2 0 0 1 2-1.4h.4a2 2 0 0 1 2 2v3h3a2 2 0 0 1 2 2l-2 8a2 2 0 0 1-2 1.5H10V6Z"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.4"
                  />
                </svg>
              </span>
              Like
            </button>
            <button class="btn ghost" (click)="react(photo.id, false)" [disabled]="!canReact">
              <span class="icon">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path
                    d="M17 13v-9h3v9h-3ZM14 18l-1 3a2 2 0 0 1-2 1.4h-.4a2 2 0 0 1-2-2v-3H5a2 2 0 0 1-2-2l2-8a2 2 0 0 1 2-1.5h7v12Z"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.4"
                  />
                </svg>
              </span>
              Dislike
            </button>
            <button class="btn danger" (click)="deletePhoto(photo.id)" [disabled]="!canDelete">
              <span class="icon">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M4 7h16" fill="none" stroke="currentColor" stroke-width="1.6" />
                  <path d="M9 7V5h6v2" fill="none" stroke="currentColor" stroke-width="1.6" />
                  <rect x="6" y="7" width="12" height="13" rx="2" fill="none" stroke="currentColor" stroke-width="1.6" />
                </svg>
              </span>
              Delete
            </button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <div class="pagination">
    <button class="secondary" (click)="prev()" [disabled]="page === 1">Prev</button>
    <span>Page {{ page }}</span>
    <button class="secondary" (click)="next()" [disabled]="!canNext">Next</button>
  </div>
</section>

<div class="overlay" *ngIf="selectedUrl" (click)="closePreview()">
  <div class="modal" (click)="$event.stopPropagation()">
    <img [src]="selectedUrl" alt="full" />
    <button class="secondary" (click)="closePreview()">Close</button>
  </div>
</div>
